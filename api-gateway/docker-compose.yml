# Orchestrates the API Gateway, single-node Valkey 8, Vector Service, PostgreSQL, OpenTelemetry Collector, and Zipkin.
# Run: docker compose up -d --build

services:
  # 0. Vendor-Neutral OpenTelemetry Collector (Routes to Zipkin, Grafana Tempo, Jaeger v2, or Datadog)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver (Ingestion Port) for Spring Boot 4 & Node.js
    depends_on:
      - zipkin
    networks:
      - lyria-network

  # Distributed Tracing Dashboard UI (Receives spans from otel-collector)
  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      # navigate to "http://localhost:9411" in your browser to see a timeline graph showing exactly how many milliseconds the gateway spent running the redis lua rate limiter, and how long it waited for the microservices and Node.js backend to respond.
      - "9411:9411" # Zipkin Web UI
    networks:
      - lyria-network

  # Single-node Valkey 8 instance for local development.
  # Production deployments using multi-shard Valkey Cluster remain compatible via {identity} key hash-tags.
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    command: ["valkey-server", "--appendonly", "yes", "--io-threads", "4", "--io-threads-do-reads", "yes"]
    networks:
      - lyria-network

  # 2. Java 26 + Spring Boot 4 API Gateway
  # api-gateway:
  #   build: 
  #     context: ./path-to-java-gateway
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     # Match the exact placeholders in application.yml
  #     # REDIS_URL=redis://redis-cluster:6379
  #     - REDIS_HOST=redis-cluster
  #     - REDIS_PORT=6379
  #     - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
  #     - BACKEND_SERVICE_URL=http://node-backend:8000
  #     # Use 'local' when testing without a live Auth0/Okta URL, or provide JWT_ISSUER_URI for 'prod'
  #     - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local} # SPRING_PROFILES_ACTIVE=prod
  #   depends_on:
  #     - redis-cluster
  #     - otel-collector
  #   networks:
  #     - lyria-network
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Match the exact placeholders in application.yml
      # REDIS_URL=redis://redis-cluster:6379
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
      - BACKEND_SERVICE_URL=http://vector-service:8081
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-dev-only-internal-auth-hmac-secret-key-change-in-prod-32bytes!}
      - INTERNAL_AUTH_ISSUER=api-gateway
      # Use 'local' when testing without a live Auth0/Okta URL, or provide JWT_ISSUER_URI for 'prod'
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
    depends_on:
      - valkey
      - otel-collector
    networks:
      - lyria-network

  #3. Database for Node.js backend.
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lyria
    ports:
      - "5432:5432"
    networks:
      - lyria-network

  # 4. Your Node.js AI BFF
  # node-backend:
  #   build:
  #     context: ./path-to-node-backend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - REDIS_URL=redis://redis-cluster:6379
  #     - DATABASE_URL=postgresql://postgres:password@postgres-db:5432/lyria
  #   depends_on:
  #     - redis-cluster
  #     - postgres-db
  #   networks:
  #     - lyria-network
  # 4. Your Vector Service Microservice
  vector-service:
    build:
      context: ../Web_Application_Spring
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - REDIS_URL=redis://valkey:6379
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-dev-only-internal-auth-hmac-secret-key-change-in-prod-32bytes!}
      - INTERNAL_AUTH_ISSUER=api-gateway
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/lyria
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - valkey
      - postgres-db
    networks:
      - lyria-network

networks:
  lyria-network:
    driver: bridge