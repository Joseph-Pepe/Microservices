server:
  # ${ENVIRONMENT_VARIABLE_NAME:default_value} injects parameterized environment variable with a fallback to port 8080 (i.e., dynamic port binding).
  port: ${PORT:8080}

  # 1. CRITICAL FOR AWS/GCP/AZURE: Trust X-Forwarded-For & X-Forwarded-Proto from Cloud Load Balancers
  forward-headers-strategy: framework
  # 2. ZERO-DOWNTIME DEPLOYMENTS: Wait for active Virtual Threads to finish before stopping container
  shutdown: graceful

  # 3. HTTP/2 Support (Massively reduces latency via connection multiplexing)
  http2:
    enabled: true

  # 4. GZIP Payload Compression (Shrinks large JSON arrays by ~70-80%)
  compression:
    enabled: true
    min-response-size: 1024 # Only compress payloads larger than 1KB to save CPU
    mime-types: application/json,application/problem+json,application/xml,text/plain,text/css,application/javascript

  # 5. Tomcat Socket & Connection Tuning (Optimized for Virtual Threads)
  tomcat:
    # Max simultaneous TCP connections Tomcat will hold open. 
    # Because Virtual Threads use almost zero RAM, we can safely bump this from the default (8192) to 20000.
    max-connections: 20000
    
    # The OS-level TCP backlog queue. If 20,000 users are connected, and 2,000 more try to connect 
    # at the exact same millisecond, they wait in this queue instead of getting "Connection Refused".
    accept-count: 2000
    
    # Keep idle connections open for 60 seconds to prevent constant TLS handshake overhead.
    keep-alive-timeout: 60000
    connection-timeout: 5000 # Drop dead TCP sockets after 5 seconds to prevent Slowloris DDoS attacks

# Custom Enterprise Rate Limit Configurations
app:
  rate-limit:
    window-ms: 30000   # 30 seconds in milliseconds
    limit: 10          # Max 10 requests allowed per window
  cors:
    # Comma-separated list of allowed frontend domains
    allowed-origins: "http://localhost:3000, http://localhost:4200, http://localhost:8000"

spring:
  application:
    name: api-gateway

  # Enables Virtual Threads for Tomcat and Async Tasks (automatically gains the asynchronous event loop under the hood)
  threads:
    virtual:
      enabled: true

  # Give in-flight AI generation streams up to 20 seconds to complete during container scale-down
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # Spring Boot 4 Global HTTP Client Timeouts (applied to RestClient & Gateway)
  http:
    # Enforce strict upstream connect and read timeouts
    clients:
      connect-timeout: 3s
      read-timeout: 15s

  cloud:
    # 1. Provide a list of the available Vector API clones
    discovery:
      client:
        simple:
          instances:
            vector-service: # The name of our cluster
              - uri: http://localhost:8081
              - uri: http://localhost:8082
              - uri: http://localhost:8083

    # 2. Tell the Virtual Thread Gateway to use the Load Balancer (lb://) to find a server in the 'vector-service' cluster
    gateway:
      # Spring Cloud 2025.1+ (Spring Boot 4) Gateway Server WebMVC namespace
      server:
        webmvc:
          routes:
            - id: vector_service_route
              uri: ${BACKEND_SERVICE_URL:lb://vector-service} # Allows pointing directly to a cloud URL
              predicates:
                - Path=/api/vectors/**
              filters:
                # ZERO-TRUST: Strip any spoofed validation headers sent by external attackers first!
                - RemoveRequestHeader=X-Gateway-Validated
                # Automatically adds a custom header to the request before it hits your microservice!
                # e.g., vector-service needs to know the username (logs who requested the calculation) by extracting it and passing it as a plain HTTP header.
                - AddRequestHeader=X-Gateway-Validated, true
                # RULE #1: [RETRY] Try 2 total times for transient network errors (502, 504), try again one more time before giving up b/c it probably was a network blip.
                - Retry=2,502 BAD_GATEWAY,504 GATEWAY_TIMEOUT
                # RULE #2: [CIRCUIT BREAKER] If backend is dead, route traffic to our local /fallback endpoint (i.e., if the backend fails 50% of the time, open the circuit and return a friendly fallback message instead of making the user wait for a timeout).
                - CircuitBreaker=vectorCircuitBreaker,forward:/fallback
      # mvc:
      #   # Enforce strict upstream connect and read timeouts
      #   http-client:
      #     connect-timeout: 3000
      #     read-timeout: 15000
      #   routes:
      #     - id: vector_service_route
      #       uri: ${BACKEND_SERVICE_URL:lb://vector-service} 
      #       predicates:
      #         - Path=/api/vectors/**
      #       filters:
      #         - RemoveRequestHeader=X-Gateway-Validated
      #         - AddRequestHeader=X-Gateway-Validated, true
      #         - Retry=2,502 BAD_GATEWAY,504 GATEWAY_TIMEOUT
      #         - CircuitBreaker=vectorCircuitBreaker,forward:/fallback

  # 3. Redis / Valkey 8 Infrastructure Integration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # FAIL-FAST: Never let a hung Redis socket stall a Virtual Thread for more than 250ms
      timeout: 250ms
      # Enable connection pooling for Lettuce to match Virtual Thread throughput
      lettuce:
        pool:
          max-active: 64
          max-idle: 16
          min-idle: 8

  # Cryptographic Stateless Security (Resource Server Mode)
  security:
    oauth2:
      resourceserver:
        # Spring automatically fetches the public cryptographic keys from this URI on startup to verify that incoming JWTs were legitimately signed by your Auth Server!
        jwt:
          # Parameterized for instant deployment to Auth0, Okta, AWS Cognito, GCP, or Azure Entra ID
          issuer-uri: ${JWT_ISSUER_URI:https://your-tenant.us.auth0.com/}
          
          # Simply paste your commercial provider's Issuer URL!
          # For Auth0 [https://your-tenant.us.auth0.com/]
          # For Okta  [https://dev-123456.okta.com/oauth2/default]
          # For AWS   [https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXX]
          # issuer-uri: https://your-auth-server.com/realms/vector-realm
          # issuer-uri: https://your-tenant.us.auth0.com/ # REPLACE this with your actual Auth0/Okta URL, otherwise the app will crash on startup!
          
          # OR if connecting to a local Spring Authorization Server:
          # jwk-set-uri: http://localhost:9000/oauth2/jwks

# ==========================================
# RESILIENCE4J CIRCUIT BREAKER CONFIG
# ==========================================
# RULE #3: [TIMEOUT] if the backend takes longer than 15 seconds, kill the connection.
resilience4j:
  circuitbreaker:
    configs:
      default:
        # How many requests to evaluate before making a decision
        slidingWindowSize: 10
        # If 50% of the last 10 requests fail or timeout, open the circuit!
        failureRateThreshold: 50
        # Wait 20 seconds before "half-opening" to see if the backend recovered
        waitDurationInOpenState: 20s
        # Allow requests to take up to 15 seconds (Generative AI takes time)
        slowCallDurationThreshold: 15s
        slowCallRateThreshold: 50
  timelimiter:
    configs:
      default:
        # Hard kill any proxy connection that takes longer than 16 seconds
        timeoutDuration: 16s 
        
# ==========================================
# OBSERVABILITY & DISTRIBUTED TRACING
# ==========================================
management:
  endpoint:
    health:
      probes:
        enabled: true # Tells the cloud if the app is booting vs fully ready to take traffic
  endpoints:
    web:
      exposure:
        include: "health,prometheus" # Expose the health endpoint
  tracing:
    sampling:
      # Set to 1.0 (100%) for development so every request is tracked.
      # In production with massive traffic, drop this to 0.1 (10%) or 0.01 (1%).
      probability: 1.0
  otlp:
    tracing:
      # Export W3C traces via OTLP to the OpenTelemetry Collector (fans out to Tempo, Jaeger v2, Datadog, or Zipkin)
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
      # The standard endpoint for an OpenTelemetry Collector or OTLP-compatible backend (like Zipkin)
      # Use the exact service name defined in docker-compose.yml
      # endpoint: ${ZIPKIN_URL:http://zipkin:4318/v1/traces}

# ==========================================
# LOG CORRELATION (MDC)
# ==========================================
# Gateway generates a unique traceid.
# Automatically injects the traceId and spanId into your terminal logs! 
# Seamlessly passes it downstream to other microservices or Node.js backend via a transparent HTTP header (allows us to track a single request across multiple microservices in a single visual dashboard).
logging:
  pattern:
    # Example output: INFO [api-gateway,65b8c...a3f,2f8d...c1a] Processing request...
    level: "%5p [%X{traceId:-},%X{spanId:-}]"